<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Unpack</title>
  <link rel="stylesheet" href="/unpack/styles.css">
  <link rel="stylesheet" href="/unpack/v2.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/unpack.html" aria-label="Unpack home"><span class="mark">U</span><span>Unpack</span></a>
    <div class="top-actions"><button id="themeBtn" class="plain">Theme</button><a class="quiet-link" href="/">ServerStatus</a></div>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-copy"><h1>Unpack a website.</h1><p>HTML, linked files, headers, DNS and a ZIP export. Minecraft tools are here too.</p></div>
      <div class="lookup-card">
        <div class="kind-switch" role="tablist">
          <button class="kind active" data-kind="website">Website</button>
          <button class="kind" data-kind="minecraft">Minecraft</button>
          <button class="kind" data-kind="pack">Pack</button>
        </div>
        <form id="lookupForm" class="lookup-row">
          <input id="valueInput" autocomplete="off" spellcheck="false" placeholder="https://example.com" aria-label="Address">
          <select id="profileSelect" aria-label="Lookup speed">
            <option value="quick">Quick</option>
            <option value="fast">Fast</option>
            <option value="standard" selected>Standard</option>
            <option value="full">Full</option>
          </select>
          <button id="runBtn" type="submit" class="run">Unpack</button>
        </form>
        <div class="lookup-foot"><span id="hint">Public HTTP/HTTPS pages only.</span><span id="status"></span></div>
      </div>
    </section>

    <section id="empty" class="empty">
      <div class="empty-title">Paste an address above.</div>
    </section>

    <section id="workspace" class="workspace hidden">
      <aside class="rail" aria-label="Report sections">
        <button class="rail-item active web-only" data-section="overview">Overview</button>
        <button class="rail-item web-only" data-section="source">Source</button>
        <button class="rail-item web-only" data-section="files">Files</button>
        <button class="rail-item web-only" data-section="network">Network</button>
        <button class="rail-item web-only" data-section="headers">Headers</button>
        <button class="rail-item web-only" data-section="security">Security</button>
        <button class="rail-item mc-only hidden" data-section="minecraft">Minecraft</button>
        <button class="rail-item pack-only hidden" data-section="pack">Pack</button>
        <button class="rail-item" data-section="raw">Raw</button>
        <div class="rail-spacer"></div>
        <a class="rail-link" href="/">ServerStatus <span>↗</span></a>
      </aside>
      <div id="content" class="content"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/unpack/app-v2.js"></script>
</body>
</html>
