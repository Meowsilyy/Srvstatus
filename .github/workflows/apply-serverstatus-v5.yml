name: Apply ServerStatus v5

on:
  push:
    paths:
      - ".v5/ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply update
        run: |
          cat .v5/part*.patch > /tmp/serverstatus-v5.patch
          git apply --check /tmp/serverstatus-v5.patch
          git apply /tmp/serverstatus-v5.patch
          rm -rf .v5
          rm -f .github/workflows/apply-serverstatus-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update ServerStatus to v5"
          git push
