name: Build SRVSTATUS Desktop

on:
  push:
    branches:
      - serverstatus-app
    paths:
      - desktop/**
      - public/**
      - server.py
      - integrate_unpack.py
      - .release/**
      - .github/workflows/build-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt

      - name: Prepare SRVSTATUS release files
        run: python desktop/prepare_release.py

      - name: Verify Python sources
        run: python -m py_compile server.py unpack_feature.py unpack_core.py unpack_core_v2.py unpack_core_v3.py unpack_core_v4.py unpack_minecraft.py unpack_pack.py desktop/desktop.py

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SRVSTATUS --paths . --add-data "public;public" desktop/desktop.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SRVSTATUS-Windows
          path: dist/SRVSTATUS.exe
          if-no-files-found: error
          compression-level: 0
