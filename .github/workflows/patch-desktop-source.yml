name: Patch desktop source

on:
  push:
    branches:
      - serverstatus-app
    paths:
      - .github/workflows/patch-desktop-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: serverstatus-app
          fetch-depth: 0
      - name: Apply compiler fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('desktop/NetworkEngine.cs')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ('var host = parsedIp.ToString();', 'var ipHost = parsedIp.ToString();'),
              ('parsedIp.AddressFamily == AddressFamily.InterNetworkV6 ? $"[{host}]" : host;', 'parsedIp.AddressFamily == AddressFamily.InterNetworkV6 ? $"[{ipHost}]" : ipHost;'),
              ('return new TargetInfo(raw, host, 443, "https", "/", false, $"https://{bracketed}/", true, null);', 'return new TargetInfo(raw, ipHost, 443, "https", "/", false, $"https://{bracketed}/", true, null);'),
              ('if (raw is not JsonObject obj || !string.IsNullOrWhiteSpace(GetString(obj["error"]))) return obj;', 'if (raw is not JsonObject obj) return null;\n        if (!string.IsNullOrWhiteSpace(GetString(obj["error"]))) return obj;'),
              ('.Select(x => (x.Lat!.Value, x.Lon!.Value)).ToList();', '.Select(x => (Lat: x.Lat!.Value, Lon: x.Lon!.Value)).ToList();'),
              ('coords.Average(x => x.Value)', 'coords.Average(x => x.Lat)'),
              ('coords.Average(x => x.Value1)', 'coords.Average(x => x.Lon)'),
              ('HaversineKm(coords[i].Value, coords[i].Value1, coords[j].Value, coords[j].Value1)', 'HaversineKm(coords[i].Lat, coords[i].Lon, coords[j].Lat, coords[j].Lon)')
          ]
          for old, new in fixes:
              if old not in s:
                  raise SystemExit(f'Missing expected source fragment: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/NetworkEngine.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix desktop network engine compiler errors"
          git push origin HEAD:serverstatus-app
