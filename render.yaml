services:
  - type: web
    name: serverstatus
    runtime: python
    plan: free
    buildCommand: cat .v5/part*.patch > /tmp/serverstatus-v5.patch && git apply --check /tmp/serverstatus-v5.patch && git apply /tmp/serverstatus-v5.patch && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NO_BROWSER
        value: "1"
