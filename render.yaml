services:
  - type: web
    name: serverstatus
    runtime: python
    plan: free
    buildCommand: cat .v8/bin00 .v8/bin01 .v8/bin02 .v8/bin03 .v8/bin04 > /tmp/serverstatus-v8.tar.gz && echo "9409879a7a8ed9e9067ce2d48e490f204752a988a9e26fbf25d4f13020c48a54  /tmp/serverstatus-v8.tar.gz" | sha256sum -c - && tar -xzf /tmp/serverstatus-v8.tar.gz && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NO_BROWSER
        value: "1"
