services:
  - type: web
    name: serverstatus
    runtime: python
    plan: free
    buildCommand: base64 -d .v5/serverstatus-v5.zip.b64 > /tmp/serverstatus-v5.zip && unzip -oq /tmp/serverstatus-v5.zip -d . && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NO_BROWSER
        value: "1"
