services:
  - type: web
    name: serverstatus
    runtime: python
    plan: free
    buildCommand: cat .v5/chunk0* | base64 -d > /tmp/serverstatus-v5.tar.gz && tar -xzf /tmp/serverstatus-v5.tar.gz && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NO_BROWSER
        value: "1"
