services:
  - type: web
    name: serverstatus
    runtime: python
    plan: free
    buildCommand: cat .v6/chunk00 .v6/chunk01 .v6/fix02a1 .v6/fix02a2p1 .v6/fix02a2p2 .v6/fix02a2p3_1 .v6/fix02a2p3_2 .v6/fix02a2p4 .v6/fix02b .v6/fix03a .v6/fix03b .v6/fix04a .v6/fix04b .v6/fix05a .v6/fix05b .v6/chunk06 .v6/chunk07 .v6/chunk08 | base64 -d > /tmp/serverstatus-v6.tar.gz && echo "747abd1ad43c511cfa415dcdfcb2d4d543612738a114093ef9b6c0c09b5eecbc  /tmp/serverstatus-v6.tar.gz" | sha256sum -c - && tar -xzf /tmp/serverstatus-v6.tar.gz && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NO_BROWSER
        value: "1"
